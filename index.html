<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<script src="https://cdn.jsdelivr.net/gh/kitao/pyxel/wasm/pyxel.js"></script>

<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }

  /* スマホでキャンバスが拡大される時、ブラウザが「なめらかに」拡大しようとして
     文字がにじんで見える。ドット絵をそのまま拡大する設定にして、くっきり見せる。 */
  canvas {
    image-rendering: -moz-crisp-edges;
    image-rendering: -webkit-optimize-contrast;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    -ms-interpolation-mode: nearest-neighbor;
  }
</style>

<script>
  // ゲーム内部の解像度（英単語ゲームの SCREEN_W / SCREEN_H と合わせる）
  var LOGICAL_W = 240;
  var LOGICAL_H = 320;

  // 画面の白い枠線などが「チカチカ」して見えるのは、キャンバスが
  // 中途半端な倍率（例: 2.3倍など）に引き伸ばされていることが原因のことが多い。
  // ここで「画面に収まる最大の整数倍（2倍、3倍…）」に固定することで、
  // 1つ1つのドットがきれいな正方形のまま拡大されるようにする。
  function fitCanvasIntegerScale() {
    var canvas = document.querySelector("canvas");
    if (!canvas) return;

    var maxW = window.innerWidth;
    var maxH = window.innerHeight;
    var scale = Math.floor(Math.min(maxW / LOGICAL_W, maxH / LOGICAL_H));
    if (scale < 1) scale = 1;

    canvas.style.width = (LOGICAL_W * scale) + "px";
    canvas.style.height = (LOGICAL_H * scale) + "px";
  }

  window.addEventListener("resize", fitCanvasIntegerScale);
  window.addEventListener("orientationchange", function () {
    setTimeout(fitCanvasIntegerScale, 300);
  });

  // pyxel.js が後からcanvasを作るので、出現を監視してからサイズを合わせる
  document.addEventListener("DOMContentLoaded", function () {
    var observer = new MutationObserver(function () {
      if (document.querySelector("canvas")) {
        fitCanvasIntegerScale();
      }
    });
    observer.observe(document.body, { childList: true, subtree: true });

    // 念のため、少し時間を置いても一度合わせておく
    setTimeout(fitCanvasIntegerScale, 300);
    setTimeout(fitCanvasIntegerScale, 1000);
  });
</script>

</head>

<body>

<pyxel-run name="english_eiken.py"></pyxel-run>

</body>
</html>
